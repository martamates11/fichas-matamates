<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22355e"/>
      <stop offset="1" stop-color="#141e36"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c26a"/>
      <stop offset="1" stop-color="#b8922a"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <!-- folio trasero (otro modelo) -->
  <g transform="rotate(-9 256 266)" filter="url(#sombra)">
    <rect x="148" y="118" width="208" height="270" rx="14" fill="#d9c79a"/>
  </g>
  <!-- folio principal -->
  <g filter="url(#sombra)">
    <path d="M168 112 H316 L364 160 V392 a14 14 0 0 1 -14 14 H168 a14 14 0 0 1 -14 -14 V126 a14 14 0 0 1 14 -14 Z" fill="#fbf7ee"/>
  </g>
  <path d="M316 112 V146 a14 14 0 0 0 14 14 H364 Z" fill="#e3d6b5"/>
  <!-- cabecera -->
  <rect x="184" y="146" width="96" height="12" rx="6" fill="#1a2744"/>
  <rect x="184" y="172" width="150" height="6" rx="3" fill="#c9c2b1"/>
  <!-- expresión -->
  <text x="186" y="262" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="76" fill="#1a2744">f(x)</text>
  <!-- líneas de respuesta -->
  <rect x="184" y="296" width="150" height="6" rx="3" fill="#c9c2b1"/>
  <rect x="184" y="320" width="120" height="6" rx="3" fill="#c9c2b1"/>
  <rect x="184" y="344" width="138" height="6" rx="3" fill="#c9c2b1"/>
  <!-- sello de corrección -->
  <circle cx="352" cy="368" r="56" fill="url(#oro)" stroke="#141e36" stroke-width="8"/>
  <path d="M326 369 l18 18 l35 -38" fill="none" stroke="#141e36" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
