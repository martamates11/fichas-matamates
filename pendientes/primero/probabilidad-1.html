<script>
// ============================================================
// CLASES DE EJERCICIOS
// ============================================================

// Respuesta vacía: avisa y no cuenta como fallo
const AVISO_VACIO = "⚠️ Escribe tu respuesta antes de comprobar. No cuenta como fallo.";
function esVacio(respuestas) {
  const valores = Object.values(respuestas ?? {}).flatMap(v => (v && typeof v === 'object' ? Object.values(v) : [v]));
  return valores.every(v => v === undefined || v === null || String(v).trim() === '' || (typeof v === 'number' && isNaN(v)));
}

// Número escrito como decimal (con coma o punto) o como fracción a/b; NaN si no es ninguno
function leerNumero(texto) {
  const t = String(texto ?? '').trim().replace(/\s*\/\s*/, '/').replace(',', '.');
  const num = s => (/^\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN);
  if (t.includes('/')) {
    const p = t.split('/');
    return p.length === 2 ? num(p[0]) / num(p[1]) : NaN;
  }
  return num(t);
}

class Ejercicio1 {
  constructor() {
    this.superado = false;
    this.generarParejas();
  }

  generarParejas() {
    this.conceptos = [
      "Espacio muestral", "Suceso", "Suceso elemental",
      "Suceso contrario", "Suceso seguro", "Suceso imposible"
    ];
    this.definiciones = [
      "Conjunto de todos los resultados posibles de un experimento aleatorio.",
      "Subconjunto del espacio muestral.",
      "Suceso que consta de un único resultado.",
      "Suceso que ocurre cuando NO ocurre el suceso A.",
      "Suceso que ocurre siempre, con probabilidad 1.",
      "Suceso que nunca ocurre, con probabilidad 0."
    ];

    let indicesConc = [...Array(6).keys()];
    for (let i = indicesConc.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indicesConc[i], indicesConc[j]] = [indicesConc[j], indicesConc[i]];
    }
    this.conceptosMezclados = indicesConc.map(i => this.conceptos[i]);

    let indicesDef = [...Array(6).keys()];
    for (let i = indicesDef.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indicesDef[i], indicesDef[j]] = [indicesDef[j], indicesDef[i]];
    }
    this.defsMezcladas = indicesDef.map(i => this.definiciones[i]);

    this.respuestas = new Array(6).fill(null);
    this.pareados = new Array(6).fill(false);
    this.seleccionConcepto = null;
  }

  seleccionarConcepto(i) {
    if (!this.superado && !this.pareados[i]) this.seleccionConcepto = i;
  }

  seleccionarDefinicion(j) {
    if (this.superado || this.seleccionConcepto === null) return false;
    if (this.respuestas[this.seleccionConcepto] !== null) return false;
    if (this.respuestas.includes(j)) return false;

    let conceptoCorrecto = this.conceptosMezclados[this.seleccionConcepto];
    let indiceOriginalConcepto = this.conceptos.indexOf(conceptoCorrecto);
    let definicionCorrecta = this.definiciones[indiceOriginalConcepto];
    let defSeleccionada = this.defsMezcladas[j];

    if (definicionCorrecta === defSeleccionada) {
      this.respuestas[this.seleccionConcepto] = j;
      this.pareados[this.seleccionConcepto] = true;
      this.seleccionConcepto = null;
      return true;
    } else {
      return false;
    }
  }

  verificar() {
    if (this.superado) return { correcto: false, superado: true };
    if (this.pareados.every(v => !v)) return { vacio: true, correcto: false, superado: false, msg: "⚠️ Empareja al menos un concepto antes de comprobar. No cuenta como fallo." };
    let todosPareados = this.pareados.every(v => v === true);
    if (todosPareados) {
      this.superado = true;
      return { correcto: true, superado: true, msg: "🎉 ¡Correcto! Has emparejado todos los conceptos." };
    } else {
      return { correcto: false, superado: false, msg: `❌ Faltan ${this.pareados.filter(v => !v).length} emparejamientos. Sigue intentándolo.` };
    }
  }
}

class Ejercicio2 {
  constructor() {
    this.superado = false;
    this.generarFrases();
  }

  generarFrases() {
    this.frases = [
      { texto: "La probabilidad de un suceso siempre es menor o igual que 1", respuestaCorrecta: "V", explicacion: "La probabilidad siempre está entre 0 y 1, ambos inclusive." },
      { texto: "Si P(A) > P(B) entonces es más fácil que ocurra B", respuestaCorrecta: "F", explicacion: "Si P(A) > P(B), significa que A tiene más probabilidad, por lo que es más fácil que ocurra A, no B." },
      { texto: "Cuanto más difícil es que ocurra un suceso, su probabilidad se acerca a 1", respuestaCorrecta: "F", explicacion: "Cuanto más difícil es un suceso, su probabilidad se acerca a 0, no a 1." },
      { texto: "Una probabilidad cercana a 0 significa que el suceso es casi seguro que ocurra", respuestaCorrecta: "F", explicacion: "Probabilidad cercana a 0 significa que es muy poco probable que ocurra, no que sea seguro." },
      { texto: "Dos sucesos equiprobables tienen igual probabilidad", respuestaCorrecta: "V", explicacion: "Equiprobable significa precisamente que tienen la misma probabilidad." },
      { texto: "La regla de Laplace es casos favorables / casos posibles", respuestaCorrecta: "V", explicacion: "La regla de Laplace para calcular probabilidades es: P = (casos favorables) / (casos posibles)." }
    ];
    for (let i = this.frases.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [this.frases[i], this.frases[j]] = [this.frases[j], this.frases[i]];
    }
  }

  verificar(respuestasUsuario) {
    if (this.superado) return { correcto: false, superado: true };
    if (esVacio(respuestasUsuario)) return { vacio: true, correcto: false, superado: false, msg: "⚠️ Elige V o F antes de comprobar. No cuenta como fallo." };
    let incorrectas = [];
    for (let i = 0; i < this.frases.length; i++) {
      if (respuestasUsuario[i] !== this.frases[i].respuestaCorrecta) {
        incorrectas.push(i);
      }
    }
    if (incorrectas.length === 0) {
      this.superado = true;
      return { correcto: true, superado: true, msg: "🎉 ¡Excelente! Todas las afirmaciones correctas." };
    } else {
      let explicacion = `<div class="feedback-explicacion"><strong>📚 Explicación de los errores:</strong><br>`;
      for (let idx of incorrectas) {
        explicacion += `• ${this.frases[idx].texto}<br>`;
        explicacion += `  <span style="color: var(--color-incorrecto);">❌ Tu respuesta: ${respuestasUsuario[idx] || "(vacía)"}</span><br>`;
        explicacion += `  <span style="color: var(--color-correcto);">✓ Correcto: ${this.frases[idx].respuestaCorrecta}</span><br>`;
        explicacion += `  💡 ${this.frases[idx].explicacion}<br><br>`;
      }
      explicacion += `</div>`;
      return { correcto: false, superado: false, msg: `❌ Tienes ${incorrectas.length} fallo(s). Revisa las explicaciones.`, explicacion: explicacion };
    }
  }
}

class Ejercicio3 {
  constructor() {
    this.superado = false;
    this.generarTabla();
  }

  // Cada fila sale al azar de un repertorio de sucesos con datos variables, así
  // que las soluciones cambian de una tabla a otra.
  generarTabla() {
    const azar = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
    const elegir = (lista) => lista[Math.floor(Math.random() * lista.length)];
    const sucesosDado = () => {
      const k = azar(1, 6), m = azar(2, 5), n = azar(2, 5);
      return [
        { suceso: `Sacar un ${k} al tirar un dado de 6 caras`, casosPosibles: 6, favorables: 1, explicacion: `Un dado tiene 6 caras numeradas del 1 al 6. Solo una de ellas tiene el ${k}.` },
        { suceso: `Sacar número ${elegir(["par", "impar"])} al tirar un dado`, casosPosibles: 6, favorables: 3, explicacion: "En un dado, los pares son 2, 4, 6 (3 números) y los impares son 1, 3, 5 (3 números)." },
        { suceso: `Sacar un número menor que ${m} al tirar un dado`, casosPosibles: 6, favorables: m - 1, explicacion: `Los números menores que ${m} en un dado son: ${Array.from({ length: m - 1 }, (_, i) => i + 1).join(', ')}. Son ${m - 1}.` },
        { suceso: `Sacar un número mayor que ${n} al tirar un dado`, casosPosibles: 6, favorables: 6 - n, explicacion: `Los números mayores que ${n} en un dado son: ${Array.from({ length: 6 - n }, (_, i) => n + 1 + i).join(', ')}. Son ${6 - n}.` },
        { suceso: "Sacar un múltiplo de 3 al tirar un dado", casosPosibles: 6, favorables: 2, explicacion: "En un dado, los múltiplos de 3 son el 3 y el 6." },
        { suceso: "Sacar un número primo al tirar un dado", casosPosibles: 6, favorables: 3, explicacion: "En un dado, los números primos son 2, 3 y 5 (el 1 no es primo)." },
        { suceso: "Sacar un divisor de 6 al tirar un dado", casosPosibles: 6, favorables: 4, explicacion: "Los divisores de 6 que hay en un dado son 1, 2, 3 y 6." },
      ];
    };
    const sucesosBaraja = () => [
      { suceso: `Sacar ${elegir(["oros", "copas", "espadas", "bastos"])} al coger una carta de la baraja española (40 cartas)`, casosPosibles: 40, favorables: 10, explicacion: "La baraja española tiene 4 palos (oros, copas, espadas y bastos) con 10 cartas cada uno." },
      { suceso: "Sacar un as al coger una carta de la baraja española (40 cartas)", casosPosibles: 40, favorables: 4, explicacion: "Hay un as en cada uno de los 4 palos." },
      { suceso: "Sacar una figura (sota, caballo o rey) al coger una carta de la baraja española (40 cartas)", casosPosibles: 40, favorables: 12, explicacion: "Cada palo tiene 3 figuras (sota, caballo y rey), y hay 4 palos: 3 · 4 = 12." },
      { suceso: `Sacar el ${elegir(["rey", "caballo", "as", "siete"])} de ${elegir(["oros", "copas", "espadas", "bastos"])} al coger una carta de la baraja española (40 cartas)`, casosPosibles: 40, favorables: 1, explicacion: "Esa carta concreta solo está una vez en la baraja." },
    ];
    const sucesoBolsa = () => {
      const colores = [["roja", "rojas"], ["azul", "azules"], ["verde", "verdes"], ["amarilla", "amarillas"]];
      const i = azar(0, 3);
      let j = azar(0, 2); if (j >= i) j++;
      const x = azar(2, 9), y = azar(2, 9);
      return { suceso: `Sacar una bola ${colores[i][0]} de una bolsa con ${x} bolas ${colores[i][1]} y ${y} bolas ${colores[j][1]}`, casosPosibles: x + y, favorables: x, explicacion: `En la bolsa hay ${x} + ${y} = ${x + y} bolas, y ${x} son ${colores[i][1]}.` };
    };
    const sucesoBombo = () => {
      const total = elegir([10, 12, 20, 30]);
      const opciones = [
        { suceso: `Sacar un número par de un bombo con bolas numeradas del 1 al ${total}`, favorables: total / 2, explicacion: `Del 1 al ${total} hay ${total / 2} números pares.` },
        { suceso: `Sacar un múltiplo de 5 de un bombo con bolas numeradas del 1 al ${total}`, favorables: Math.floor(total / 5), explicacion: `Los múltiplos de 5 del 1 al ${total} son ${Array.from({ length: Math.floor(total / 5) }, (_, i) => 5 * (i + 1)).join(', ')}.` },
        { suceso: `Sacar un número de una cifra de un bombo con bolas numeradas del 1 al ${total}`, favorables: 9, explicacion: `Del 1 al ${total}, los números de una cifra son del 1 al 9: son 9.` },
      ];
      return { ...elegir(opciones), casosPosibles: total };
    };
    const moneda = { suceso: `Salir ${elegir(["cara", "cruz"])} al tirar una moneda`, casosPosibles: 2, favorables: 1, explicacion: "La moneda tiene 2 caras (cara y cruz). Solo una de ellas es la que buscas." };
    const dados = sucesosDado();
    const d1 = azar(0, dados.length - 1);
    let d2 = azar(0, dados.length - 2); if (d2 >= d1) d2++;
    this.filas = [
      Math.random() < 0.3 ? moneda : sucesoBombo(),
      dados[d1],
      elegir(sucesosBaraja()),
      sucesoBolsa(),
      dados[d2],
    ].map(f => ({ ...f, prob: f.favorables / f.casosPosibles }));
  }

  verificar(respuestas) {
    if (this.superado) return { correcto: false, superado: true };
    if (esVacio(respuestas)) return { vacio: true, correcto: false, superado: false, msg: AVISO_VACIO };
    let errores = [];
    for (let i = 0; i < this.filas.length; i++) {
      const row = respuestas[i] ?? {};
      let pos = row.pos;
      let fav = row.fav;
      let probVal = leerNumero(row.prob);
      let erroresFila = [];
      if (isNaN(pos) || pos !== this.filas[i].casosPosibles) erroresFila.push(`casos posibles (debe ser ${this.filas[i].casosPosibles})`);
      if (isNaN(fav) || fav !== this.filas[i].favorables) erroresFila.push(`casos favorables (debe ser ${this.filas[i].favorables})`);
      if (isNaN(probVal) || Math.abs(probVal - this.filas[i].prob) > 0.01) erroresFila.push(`probabilidad (debe ser ≈${this.filas[i].prob.toFixed(2)}, o en fracción: ${this.filas[i].favorables}/${this.filas[i].casosPosibles})`);
      if (erroresFila.length > 0) {
        errores.push({ fila: i, suceso: this.filas[i].suceso, errores: erroresFila, explicacion: this.filas[i].explicacion });
      }
    }
    if (errores.length === 0) {
      this.superado = true;
      return { correcto: true, superado: true, msg: "🎉 ¡Tabla completada correctamente!" };
    } else {
      let explicacion = `<div class="feedback-explicacion"><strong>📚 Corrección y explicación:</strong><br>`;
      for (let err of errores) {
        explicacion += `<br><strong>❌ ${err.suceso}</strong><br>`;
        explicacion += `   Error en: ${err.errores.join(', ')}<br>`;
        explicacion += `   💡 ${err.explicacion}<br>`;
      }
      explicacion += `<br>👉 Ahora inténtalo con esta tabla nueva.</div>`;
      // Tras un fallo que enseña las soluciones, otra tabla con otros sucesos
      const firma = () => JSON.stringify(this.filas.map(f => f.suceso));
      const soluciones = () => JSON.stringify(this.filas.map(f => [f.casosPosibles, f.favorables]));
      const f0 = firma(), s0 = soluciones();
      for (let n = 0; n < 50; n++) {
        this.generarTabla();
        if (firma() !== f0 && soluciones() !== s0) break;
      }
      return { correcto: false, superado: false, msg: `❌ Tienes ${errores.length} fila(s) incorrecta(s).`, explicacion: explicacion, nuevoEnunciado: true };
    }
  }
}

class Ejercicio4 {
  constructor() {
    this.superado = false;
    this.generarUrna();
  }

  generarUrna() {
    let total = 12 + Math.floor(Math.random() * 13);
    // Partimos 'total' en 3 grupos >= 1 mediante dos cortes aleatorios distintos,
    // y barajamos qué grupo corresponde a cada color para que ninguno tenga
    // sesgado un mínimo distinto de los demás (antes 'azules' nunca bajaba de 2).
    let corte1 = 1 + Math.floor(Math.random() * (total - 1));
    let corte2 = 1 + Math.floor(Math.random() * (total - 1));
    while (corte2 === corte1) corte2 = 1 + Math.floor(Math.random() * (total - 1));
    const cMin = Math.min(corte1, corte2), cMax = Math.max(corte1, corte2);
    let grupos = [cMin, cMax - cMin, total - cMax];
    for (let i = grupos.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [grupos[i], grupos[j]] = [grupos[j], grupos[i]];
    }
    const [rojas, verdes, azules] = grupos;
    this.urna = { rojas, verdes, azules, total };
    this.preguntas = [
      { texto: "Probabilidad de sacar una bola roja", respuesta: rojas / total, formula: `P(roja) = rojas/total = ${rojas}/${total}` },
      { texto: "Probabilidad de sacar una bola verde", respuesta: verdes / total, formula: `P(verde) = verdes/total = ${verdes}/${total}` },
      { texto: "Probabilidad de sacar una bola azul", respuesta: azules / total, formula: `P(azul) = azules/total = ${azules}/${total}` },
      { texto: "Probabilidad de NO sacar una bola roja", respuesta: (verdes + azules) / total, formula: `P(no roja) = (verdes+azules)/total = ${verdes + azules}/${total}` }
    ];
  }

  verificar(respuestas) {
    if (this.superado) return { correcto: false, superado: true };
    if (esVacio(respuestas)) return { vacio: true, correcto: false, superado: false, msg: AVISO_VACIO };
    let errores = [];
    for (let i = 0; i < this.preguntas.length; i++) {
      let val = respuestas[i] ?? '';
      let num = leerNumero(val);
      if (isNaN(num) || Math.abs(num - this.preguntas[i].respuesta) > 0.01) {
        errores.push({ index: i, pregunta: this.preguntas[i], respuestaUsuario: val });
      }
    }
    if (errores.length === 0) {
      this.superado = true;
      return { correcto: true, superado: true, msg: "🎉 ¡Perfecto! Has calculado bien todas las probabilidades." };
    } else {
      let explicacion = `<div class="feedback-explicacion"><strong>📚 Aprendamos de los errores:</strong><br><br>`;
      for (let err of errores) {
        explicacion += `<strong>❌ ${err.pregunta.texto}</strong><br>`;
        explicacion += `   Tu respuesta: "${err.respuestaUsuario || '(vacío)'}"<br>`;
        explicacion += `   Respuesta correcta: ≈${err.pregunta.respuesta.toFixed(2)} (${err.pregunta.formula})<br>`;
        explicacion += `   💡 Recuerda: Probabilidad = casos favorables / casos posibles.<br>`;
        explicacion += `   En este caso: ${err.pregunta.formula}<br><br>`;
      }
      explicacion += `👉 Ahora inténtalo con esta urna nueva.</div>`;
      // Tras un fallo que enseña las soluciones, otra urna con otras soluciones:
      // copiar las mostradas ya no supera el ejercicio.
      const anteriores = this.preguntas.map(p => p.respuesta);
      for (let n = 0; n < 50; n++) {
        this.generarUrna();
        if (this.preguntas.every((p, i) => Math.abs(p.respuesta - anteriores[i]) > 0.001)) break;
      }
      return { correcto: false, superado: false, msg: `❌ Tienes ${errores.length} error(es). Revisa las explicaciones.`, explicacion: explicacion, nuevoEnunciado: true };
    }
  }
}

function formatearTiempoTranscurrido() {
  if (!horaInicio) return '00:00';
  const ms = Date.now() - horaInicio;
  // Redondeamos SIEMPRE hacia arriba al minuto siguiente (salvo 0 minutos exactos)
  const minutosTotales = Math.ceil(ms / 60000);
  const horas = Math.floor(minutosTotales / 60);
  const minutos = minutosTotales % 60;
  return `${String(horas).padStart(2, '0')}:${String(minutos).padStart(2, '0')}`;
}

function actualizarInfoBar() {
  if (!ejercicios.length) return { superados: 0, notaFinal: 0, notaBase: 0 };
  const superados = ejercicios.filter(e => e.superado).length;
  let notaBase = superados - (fallosGlobales * 0.2);
  if (notaBase < 0) notaBase = 0;
  let notaFinal = (notaBase / 4) * 10;
  if (notaFinal > 10) notaFinal = 10;
  return { superados, notaFinal, notaBase };
}

function registrarError() {

// ---------- Verificar / Nuevo ----------
// Lee lo que hay escrito ahora mismo en los campos (si se pulsa Enter, el evento
// «change» del último campo aún no se ha disparado)
function sincronizarCampos(idx) {
  if (idx === 2) {
    ejercicios[2].filas.forEach((_, i) => {
      const p = document.getElementById('ej3_pos_' + i), f = document.getElementById('ej3_fav_' + i), q = document.getElementById('ej3_prob_' + i);
      if (p && f && q) respuestasEj3[i] = { pos: parseFloat(p.value), fav: parseFloat(f.value), prob: q.value };
    });
  } else if (idx === 3) {
    ejercicios[3].preguntas.forEach((_, i) => {
      const e = document.getElementById('ej4_resp_' + i);
      if (e) respuestasEj4[i] = e.value;
    });
  }
}

function verificarEjercicio(idx) {
  sincronizarCampos(idx);
  let result;
  if (idx === 0) {
    result = ejercicios[0].verificar();
  } else if (idx === 1) {
    result = ejercicios[1].verificar(respuestasEj2);
  } else if (idx === 2) {
    result = ejercicios[2].verificar(respuestasEj3);
  } else {
    result = ejercicios[3].verificar(respuestasEj4);
  }
  if (!result.correcto && !result.superado && !result.vacio) registrarError();
  // Tras un fallo se plantea otra tabla o urna: los campos se vacían
  if (result.nuevoEnunciado) {
    if (idx === 2) respuestasEj3 = {};
    if (idx === 3) respuestasEj4 = {};
  }
  feedbackMessages[`fb_e${idx + 1}`] = result;
  renderContainer(idx);
  renderInfoBar();
}

function nuevoEjercicio(idx) {
  let newEj;
  if (idx === 0) newEj = new Ejercicio1();
  else if (idx === 1) newEj = new Ejercicio2();
  else if (idx === 2) newEj = new Ejercicio3();
  else newEj = new Ejercicio4();
  ejercicios[idx] = newEj;
  feedbackMessages[`fb_e${idx + 1}`] = null;
  if (idx === 1) respuestasEj2 = {};
  if (idx === 2) respuestasEj3 = {};
  if (idx === 3) respuestasEj4 = {};
  if (idx === 0) {
    selectedConcepto = null;
    ej1Selected = null;
  }
  renderContainer(idx);
  renderInfoBar();
}

  const fb = feedbackMessages[`fb_e${idx + 1}`];

function dibujarUrna() {
  const canvas = document.getElementById('urnaCanvas');
  if (!canvas || !ejercicios[3] || ejercicios[3].superado) return;
  const ctx = canvas.getContext('2d');
  const w = 300, h = 200;
  canvas.width = w;
  canvas.height = h;
  const { rojas, verdes, azules, total } = ejercicios[3].urna;

  ctx.fillStyle = '#C9A96E';
  ctx.fillRect(40, 60, 220, 120);
  ctx.fillStyle = '#A0522D';
  ctx.fillRect(45, 55, 210, 10);
  ctx.fillStyle = '#8B5A2B';
  ctx.beginPath();
  ctx.ellipse(150, 60, 110, 20, 0, 0, Math.PI * 2);
  ctx.fill();

  const radio = 12;
  const startX = 70;
  const startY = 100;
  const cols = Math.min(8, total);
  let bolasDibujadas = 0;

  for (let i = 0; i < rojas && bolasDibujadas < 20; i++) {
    let fila = Math.floor(bolasDibujadas / cols);
    let col = bolasDibujadas % cols;
    let x = startX + col * 22;
    let y = startY + fila * 22;
    if (y + radio < 160) {
      ctx.beginPath();
      ctx.arc(x, y, radio, 0, Math.PI * 2);
      ctx.fillStyle = '#C95A4A';
      ctx.fill();
      ctx.strokeStyle = '#8B3A2A';
      ctx.stroke();
      ctx.fillStyle = 'white';
      ctx.font = 'bold 10px Arial';
      ctx.fillText('R', x - 4, y + 4);
    }
    bolasDibujadas++;
  }
  for (let i = 0; i < verdes && bolasDibujadas < 20; i++) {
    let fila = Math.floor(bolasDibujadas / cols);
    let col = bolasDibujadas % cols;
    let x = startX + col * 22;
    let y = startY + fila * 22;
    if (y + radio < 160) {
      ctx.beginPath();
      ctx.arc(x, y, radio, 0, Math.PI * 2);
      ctx.fillStyle = '#5A8F5A';
      ctx.fill();
      ctx.strokeStyle = '#3A6F3A';
      ctx.stroke();
      ctx.fillStyle = 'white';
      ctx.font = 'bold 10px Arial';
      ctx.fillText('V', x - 4, y + 4);
    }
    bolasDibujadas++;
  }
  for (let i = 0; i < azules && bolasDibujadas < 20; i++) {
    let fila = Math.floor(bolasDibujadas / cols);
    let col = bolasDibujadas % cols;
    let x = startX + col * 22;
    let y = startY + fila * 22;
    if (y + radio < 160) {
      ctx.beginPath();
      ctx.arc(x, y, radio, 0, Math.PI * 2);
      ctx.fillStyle = '#6B8E9A';
      ctx.fill();
      ctx.strokeStyle = '#4B6E7A';
      ctx.stroke();
      ctx.fillStyle = 'white';
      ctx.font = 'bold 10px Arial';
      ctx.fillText('A', x - 4, y + 4);
    }
    bolasDibujadas++;
  }
}

// ============ AVISO DE CONFIRMACIÓN PROPIO (en lugar de confirm del navegador) ============
function confirmar(mensaje, { si = 'Sí, reiniciar', no = 'Cancelar', titulo = '¿Seguro?' } = {}) {
    if (document.querySelector('.confirmar-ficha')) return Promise.resolve(false);
    return new Promise(resolve => {
        const fondo = document.createElement('div');
        fondo.className = 'confirmar-ficha';
        fondo.setAttribute('role', 'alertdialog');
        fondo.setAttribute('aria-modal', 'true');
        fondo.setAttribute('aria-label', titulo);
        fondo.tabIndex = -1;
        fondo.style.cssText = 'position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(44,31,14,0.55);padding:16px;';
        fondo.innerHTML =
            '<div style="background:#FFFDF7;border:2px solid #C9A96E;border-radius:14px;max-width:380px;width:100%;padding:22px 22px 18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.25);font-family:inherit;color:#2C1F0E;">' +
            '<h3 style="margin:0 0 10px;font-size:1.1rem;color:#A0522D;"></h3>' +
            '<p style="margin:0 0 18px;font-size:0.95rem;line-height:1.45;"></p>' +
            '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
            '<button type="button" data-respuesta="no" style="background:transparent;color:#6B4F35;border:2px solid #C9A96E;border-radius:30px;padding:9px 20px;font-weight:700;cursor:pointer;font-family:inherit;"></button>' +
            '<button type="button" data-respuesta="si" style="background:#A0522D;color:#FFFFFF;border:none;border-radius:30px;padding:10px 22px;font-weight:700;cursor:pointer;font-family:inherit;"></button>' +
            '</div></div>';
        fondo.querySelector('h3').textContent = '⚠️ ' + titulo;
        fondo.querySelector('p').textContent = mensaje;
        const btnNo = fondo.querySelector('[data-respuesta="no"]');
        const btnSi = fondo.querySelector('[data-respuesta="si"]');
        btnNo.textContent = no;
        btnSi.textContent = si;
        const cerrar = (respuesta) => { fondo.remove(); resolve(respuesta); };
        btnNo.addEventListener('click', () => cerrar(false));
        btnSi.addEventListener('click', () => cerrar(true));
        fondo.addEventListener('click', (e) => { if (e.target === fondo) cerrar(false); });
        fondo.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrar(false); });
        document.body.appendChild(fondo);
        btnNo.focus();
    });
}

function resetearTodo() {
  confirmar('¿Reiniciar toda la ficha? Se perderá todo el progreso.').then(ok => {
    if (!ok) return;
    iniciar();
    cerrarModales();
  });
}
