<style>

.modal-grade { font-size: 52px; font-weight: 900; margin: 12px 0; }
.modal-stats { border: 1.5px solid var(--color-borde); border-radius: 10px; padding: 12px; margin-bottom: 14px; font-family: monospace; font-size: 12px; text-align: left; background: rgba(255,255,255,0.5); }
.recordatorio { font-size: 12px; margin-top: 8px; background: var(--color-neutro); border-radius: 20px; padding: 6px; color: var(--color-texto-suave); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

<body>
<div id="root"></div>
<script>
"use strict";

// ---------------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------------
function parseNumero(valor) {
  if (valor === null || valor === undefined) return NaN;
  // solo cifras, con coma o punto decimal (así «12abc» no se da por bueno)
  const t = String(valor).trim().replace(",", ".");
  return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
}

const AVISO = " No cuenta como fallo.";

// Artículo y verbo que concuerdan con cada producto («Unos zapatos cuestan»)
const ARTICULO = {
  camiseta: "Una", "pantalón": "Un", zapatos: "Unos", chaqueta: "Una", libro: "Un", mochila: "Una", gorra: "Una", bufanda: "Una",
  "teléfono": "Un", tablet: "Una", auriculares: "Unos", reloj: "Un", consola: "Una", monitor: "Un", "portátil": "Un", teclado: "Un",
};
const conArticulo = (producto) => `${ARTICULO[producto] ?? "Un"} ${producto}`;
const esPlural = (producto) => producto.endsWith("s");
const cuesta = (producto) => (esPlural(producto) ? "cuestan" : "cuesta");

// Aviso de confirmación propio (en lugar de la ventana gris del navegador)
function confirmar(mensaje, { si = "Sí, reiniciar", no = "Cancelar", titulo = "¿Seguro?" } = {}) {
  if (document.querySelector(".confirmar-ficha")) return Promise.resolve(false);
  return new Promise((resolve) => {
    const fondo = document.createElement("div");
    fondo.className = "confirmar-ficha";
    fondo.setAttribute("role", "alertdialog");
    fondo.setAttribute("aria-modal", "true");
    fondo.setAttribute("aria-label", titulo);
    fondo.tabIndex = -1;
    fondo.style.cssText = "position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(44,31,14,0.55);padding:16px;";
    fondo.innerHTML =
      '<div style="background:#FFFDF7;border:2px solid #C9A96E;border-radius:14px;max-width:380px;width:100%;padding:22px 22px 18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.25);font-family:inherit;color:#2C1F0E;">' +
      '<h3 style="margin:0 0 10px;font-size:1.1rem;color:#A0522D;"></h3>' +
      '<p style="margin:0 0 18px;font-size:0.95rem;line-height:1.45;"></p>' +
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
      '<button type="button" data-respuesta="no" style="background:transparent;color:#6B4F35;border:2px solid #C9A96E;border-radius:30px;padding:9px 20px;font-weight:700;cursor:pointer;font-family:inherit;"></button>' +
      '<button type="button" data-respuesta="si" style="background:#A0522D;color:#FFFFFF;border:none;border-radius:30px;padding:10px 22px;font-weight:700;cursor:pointer;font-family:inherit;"></button>' +
      "</div></div>";
    fondo.querySelector("h3").textContent = "⚠️ " + titulo;
    fondo.querySelector("p").textContent = mensaje;
    const btnNo = fondo.querySelector('[data-respuesta="no"]');
    const btnSi = fondo.querySelector('[data-respuesta="si"]');
    btnNo.textContent = no;
    btnSi.textContent = si;
    const cerrar = (respuesta) => { fondo.remove(); resolve(respuesta); };
    btnNo.addEventListener("click", () => cerrar(false));
    btnSi.addEventListener("click", () => cerrar(true));
    fondo.addEventListener("click", (e) => { if (e.target === fondo) cerrar(false); });
    fondo.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrar(false); });
    document.body.appendChild(fondo);
    btnNo.focus();
  });
}

function elegirIndiceSinRepetir(longitud, ultimoIndice) {
  if (longitud <= 1) return 0;
  let indice;
  do { indice = Math.floor(Math.random() * longitud); } while (indice === ultimoIndice);
  return indice;
}

function fraccionHTML(n, d) {
  return '<span class="fraccion"><span class="fraccion-num">' + n + '</span><span class="fraccion-den">' + d + '</span></span>';
}

function escaparHTML(texto) {
  const div = document.createElement("div");
  div.textContent = texto;
  return div.innerHTML;
}

// ---------------------------------------------------------------------------
// Clase base de ejercicio
// ---------------------------------------------------------------------------
class Ejercicio {
  constructor() {
    this.racha = 0;
    this.superado = false;
    this.feedback = null;
    this.generarNuevo();
  }
  generarNuevo() {}
  verificar() {}
  // Datos del enunciado (sin estado, respuesta ni feedback), para ver que cambian
  firma() {
    const { racha, superado, feedback, inputValue, inputsValues, selectedValue, ultimoIndice, ultimaClave, ...datos } = this;
    return JSON.stringify(datos);
  }
  // Con muy pocas respuestas posibles (sí/no, verdadero/falso) exigir otra solución
  // haría adivinable la siguiente; ahí solo se pide otro enunciado
  exigeOtraSolucion() { return true; }
  claveSolucion() { return JSON.stringify([this.solucion, this.constante]); }
  // Genera un enunciado distinto del actual y, si es posible, con otra solución
  // (para que repetir o copiar la respuesta anterior no valga). No toca la racha.
  regenerarDistinto() {
    const antes = this.firma();
    const solAntes = this.claveSolucion();
    for (let i = 0; i < 50; i++) {
      this.generarNuevo();
      if (this.firma() !== antes && (!this.exigeOtraSolucion() || this.claveSolucion() !== solAntes)) return;
    }
    for (let i = 0; i < 50 && this.firma() === antes; i++) this.generarNuevo();
  }
  // «Nuevo» reinicia la racha; los fallos se conservan
  nuevoEjercicio() {
    if (this.superado) return false;
    this.regenerarDistinto();
    this.racha = 0;
    return true;
  }
}

// ---------------------------------------------------------------------------
// Ejercicio 1: Fracciones equivalentes
// ---------------------------------------------------------------------------
class EjFraccionesEquivalentes extends Ejercicio {
  exigeOtraSolucion() { return false; }
  generarNuevo() {
    const casos = [
      { a: 1, b: 2, c: 2, d: 5, equiv: false, expl: "no son equivalentes porque 1·5 = 5 es distinto de 2·2 = 4" },
      { a: 1, b: 3, c: 2, d: 6, equiv: true, expl: "son equivalentes porque 1·6 = 6 y 3·2 = 6" },
      { a: 2, b: 3, c: 4, d: 6, equiv: true, expl: "son equivalentes porque 2·6 = 12 y 3·4 = 12" },
      { a: 3, b: 4, c: 9, d: 12, equiv: true, expl: "son equivalentes porque 3·12 = 36 y 4·9 = 36" },
      { a: 2, b: 5, c: 3, d: 10, equiv: false, expl: "no son equivalentes porque 2·10 = 20 es distinto de 5·3 = 15" },
      { a: 4, b: 5, c: 8, d: 10, equiv: true, expl: "son equivalentes porque 4·10 = 40 y 5·8 = 40" },
      { a: 3, b: 7, c: 6, d: 14, equiv: true, expl: "son equivalentes porque 3·14 = 42 y 7·6 = 42" },
      { a: 5, b: 8, c: 10, d: 16, equiv: true, expl: "son equivalentes porque 5·16 = 80 y 8·10 = 80" },
      { a: 1, b: 4, c: 3, d: 8, equiv: false, expl: "no son equivalentes porque 1·8 = 8 es distinto de 4·3 = 12" },
      { a: 2, b: 7, c: 4, d: 14, equiv: true, expl: "son equivalentes porque 2·14 = 28 y 7·4 = 28" },
      { a: 3, b: 5, c: 9, d: 15, equiv: true, expl: "son equivalentes porque 3·15 = 45 y 5·9 = 45" },
      { a: 4, b: 9, c: 8, d: 18, equiv: true, expl: "son equivalentes porque 4·18 = 72 y 9·8 = 72" },
    ];
    const indice = elegirIndiceSinRepetir(casos.length, this.ultimoIndice);
    this.ultimoIndice = indice;
    this.actual = casos[indice];
    this.solucion = this.actual.equiv;
    this.explicacion = this.actual.expl;
    this.selectedValue = "";
    this.feedback = null;
  }
  verificar(valor) {
    if (this.superado) return { correcto: false, superado: true };
    if (valor === this.solucion) {
      this.racha++;
      if (this.racha >= 2) {
        this.superado = true;
        return { correcto: true, superado: true, msg: "🎉 ¡Superado! Sabes identificar fracciones equivalentes." };
      }
      const rachaPrevia = this.racha;
      this.regenerarDistinto();
      this.racha = rachaPrevia;
      return { correcto: true, superado: false, msg: `✅ ¡Correcto! (${rachaPrevia}/2 aciertos consecutivos). Aquí tienes otro ejercicio.` };
    }
    this.racha = 0;
    return {
      correcto: false,
      superado: false,
      msg: `❌ Incorrecto: ${fraccionHTML(this.actual.a, this.actual.b)} y ${fraccionHTML(this.actual.c, this.actual.d)} ${this.explicacion}. Recuerda: dos fracciones a/b y c/d son equivalentes si a·d = b·c (producto cruzado).`,
    };
  }
  render(indice) {
    const disabled = this.superado ? "disabled" : "";
    return `
      <div class="ejercicio-card ${this.superado ? "superado" : ""}" data-indice="${indice}">
        <div class="ejercicio-header">
          <span class="ejercicio-num">1</span>
          <span class="ejercicio-titulo">Fracciones equivalentes</span>
          ${this.superado ? '<span class="badge-superado">✓ Superado</span>' : ""}
        </div>
        <div class="enunciado">🔍 ¿Son equivalentes ${fraccionHTML(this.actual.a, this.actual.b)} y ${fraccionHTML(this.actual.c, this.actual.d)}?</div>
        <div class="input-area">
          <div class="campo">
            <label for="ej${indice}-select">Respuesta</label>
            <select id="ej${indice}-select" class="select-input" data-accion="select" data-indice="${indice}" ${disabled}>
              <option value="" ${this.selectedValue === "" ? "selected" : ""}>Selecciona</option>
              <option value="true" ${this.selectedValue === "true" ? "selected" : ""}>✅ Sí, son equivalentes</option>
              <option value="false" ${this.selectedValue === "false" ? "selected" : ""}>❌ No, no son equivalentes</option>
            </select>
          </div>
          <button class="btn-primary" data-accion="comprobar" data-indice="${indice}" ${disabled}>Comprobar</button>
          <button class="btn-secondary" data-accion="nuevo" data-indice="${indice}" ${disabled}>🔄 Nuevo</button>
        </div>
        ${renderFeedback(this)}
      </div>`;
  }
}

// ---------------------------------------------------------------------------
// Ejercicio 2: Magnitudes — directa o inversa
// ---------------------------------------------------------------------------
class EjMagnitudesProporcionales extends Ejercicio {
  exigeOtraSolucion() { return false; }
  generarNuevo() {
    const todas = [
      { texto: "El número de obreros (con el mismo rendimiento) y el tiempo en terminar un trabajo.", directa: false },
      { texto: "El peso de la fruta y el precio pagado por ella (mismo precio por kg).", directa: true },
      { texto: "La velocidad constante de un vehículo y el tiempo en recorrer una distancia fija.", directa: false },
      { texto: "El número de cuadernos iguales que compras y el dinero que pagas por ellos.", directa: true },
      { texto: "El número de grifos iguales abiertos y el tiempo en llenar un depósito.", directa: false },
      { texto: "Los litros de gasolina que echas y el precio pagado por ellos (mismo precio por litro).", directa: true },
      { texto: "El número de personas que reparten un trabajo y los días en acabarlo.", directa: false },
      { texto: "Los kilómetros recorridos por un coche y la gasolina consumida (velocidad constante).", directa: true },
      { texto: "El número de pintores (con el mismo ritmo) y el tiempo en pintar una casa.", directa: false },
      { texto: "El lado de un cuadrado y su perímetro.", directa: true },
      { texto: "La velocidad media y el tiempo empleado en un trayecto fijo.", directa: false },
      { texto: "El número de entradas de cine y el dinero pagado por ellas (mismo precio por entrada).", directa: true },
    ];
    const barajadas = [...todas];
    for (let i = barajadas.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [barajadas[i], barajadas[j]] = [barajadas[j], barajadas[i]];
    }
    const letras = ["a", "b", "c", "d"];
    this.opciones = barajadas.slice(0, 4).map((item, i) => ({ texto: `${letras[i]}) ${item.texto}`, directa: item.directa, selected: null }));
    this.feedback = null;
  }
  verificar(respuestas) {
    if (this.superado) return { correcto: false, superado: true };
    let aciertos = 0;
    for (let i = 0; i < this.opciones.length; i++) {
      if (respuestas[i] === this.opciones[i].directa) aciertos++;
    }
    if (aciertos === this.opciones.length) {
      this.superado = true;
      return { correcto: true, superado: true, msg: "🎉 ¡Superado! Distingues bien la proporcionalidad directa de la inversa." };
    }
    return {
      correcto: false,
      superado: false,
      msg: `❌ Tienes ${aciertos} de ${this.opciones.length} correctas. En la proporcionalidad directa, al multiplicar una magnitud por un número, la otra queda multiplicada por ese mismo número (su cociente es constante). En la inversa, al multiplicar una magnitud por un número, la otra queda dividida por ese mismo número (su producto es constante). Piensa qué pasaría si duplicaras una de las magnitudes en cada caso y vuelve a intentarlo.`,
    };
  }
  render(indice) {
    const disabled = this.superado ? "disabled" : "";
    const filas = this.opciones
      .map((op, i) => {
        const sel = op.selected === null ? "" : op.selected ? "true" : "false";
        return `
        <div style="margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <label for="ej${indice}-op${i}" style="flex:1 1 260px;">${escaparHTML(op.texto)}</label>
          <select id="ej${indice}-op${i}" class="select-input" style="width:130px" data-accion="select-opcion" data-indice="${indice}" data-opcion="${i}" ${disabled}>
            <option value="" ${sel === "" ? "selected" : ""}>Selecciona</option>
            <option value="true" ${sel === "true" ? "selected" : ""}>✅ Directa</option>
            <option value="false" ${sel === "false" ? "selected" : ""}>❌ Inversa</option>
          </select>
        </div>`;
      })
      .join("");
    return `
      <div class="ejercicio-card ${this.superado ? "superado" : ""}" data-indice="${indice}">
        <div class="ejercicio-header">
          <span class="ejercicio-num">2</span>

        expl: "Es una proporcionalidad directa: a más tiempo, más folios, en la misma proporción. Plantea 90/6 = n/40 y multiplica en cruz: n = (90 × 40) ÷ 6 = 600 folios." },
    ];
    this.casosInversa = [
      { texto: "4 obreros tardan 90 días en construir un muro. ¿Cuántos días tardarían 6 obreros?", sol: 60,
        expl: "Es una proporcionalidad inversa: a más obreros, menos días tardan. El producto obreros × días es constante: 4 × 90 = 6 × n. Despejando: n = (4 × 90) ÷ 6 = 60 días." },

      { texto: "Un coche a 80 km/h tarda 3 horas en un trayecto. ¿Cuánto tardaría a 120 km/h?", sol: 2,

      { texto: "Una granja tiene comida para 40 vacas durante 30 días. ¿Para cuántos días llegaría la comida con 60 vacas?", sol: 20,
        expl: "Es una proporcionalidad inversa: a más vacas, menos días dura la comida. El producto vacas × días es constante: 40 × 30 = 60 × n. Despejando: n = (40 × 30) ÷ 60 = 20 días." },
      { texto: "3 máquinas fabrican un pedido en 60 horas. ¿Cuánto tardarían 5 máquinas?", sol: 36,
        expl: "Es una proporcionalidad inversa: a más máquinas, menos horas tardan. El producto máquinas × horas es constante: 3 × 60 = 5 × n. Despejando: n = (3 × 60) ÷ 5 = 36 h." },
      { texto: "Con una velocidad media de 60 km/h, un ciclista tarda 4 horas en llegar. ¿Cuánto tardaría a 80 km/h?", sol: 3,
        expl: "Es una proporcionalidad inversa: a más velocidad, menos tiempo tarda. El producto velocidad × tiempo es constante: 60 × 4 = 80 × n. Despejando: n = (60 × 4) ÷ 80 = 3 h." },
    ];
    this.fase = "directa";
    this.generarDirecta();
  }
  generarDirecta() {
    const indice = elegirIndiceSinRepetir(this.casosDirecta.length, this.ultimoIndiceDirecta);
    this.ultimoIndiceDirecta = indice;
    this.actualDirecta = this.casosDirecta[indice];
    this.inputValue = "";
    this.feedback = null;
  }
  generarInversa() {
    const indice = elegirIndiceSinRepetir(this.casosInversa.length, this.ultimoIndiceInversa);
    this.ultimoIndiceInversa = indice;
    this.actualInversa = this.casosInversa[indice];
    this.inputValue = "";
    this.feedback = null;
  }
  // Mismo problema de la fase actual con otro enunciado y otra solución
  casoActual() { return this.fase === "directa" ? this.actualDirecta : this.actualInversa; }
  firma() { return this.casoActual().texto; }
  claveSolucion() { return String(this.casoActual().sol); }
  regenerarDistinto() {
    const antes = this.firma(), solAntes = this.claveSolucion();
    for (let i = 0; i < 50; i++) {
      if (this.fase === "directa") this.generarDirecta(); else this.generarInversa();
      if (this.firma() !== antes && this.claveSolucion() !== solAntes) return;
    }
  }
  nuevoEjercicio() {
    if (this.superado) return false;
    this.regenerarDistinto();
    this.racha = 0;
    return true;
  }
  verificar(valor) {
    if (this.superado) return { correcto: false, superado: true };
    const x = parseNumero(valor);
    const caso = this.fase === "directa" ? this.actualDirecta : this.actualInversa;
    if (!isNaN(x) && Math.abs(x - caso.sol) < 0.01) {
      if (this.fase === "directa") {
        this.racha = 1;
        this.fase = "inversa";
        this.generarInversa();
        return { correcto: true, superado: false, msg: "✅ ¡Correcto, primer problema superado! Aquí tienes un segundo problema." };
      }
      this.racha = 2;
      this.superado = true;
      return { correcto: true, superado: true, msg: "🎉 ¡Superado! Resuelves bien problemas de proporcionalidad directa e inversa." };
    }
    this.racha = 0;
    return { correcto: false, superado: false, msg: `❌ Incorrecto. ${caso.expl}` };
  }
  render(indice) {
    const disabled = this.superado ? "disabled" : "";
    const caso = this.fase === "directa" ? this.actualDirecta : this.actualInversa;
    const badgePaso = this.fase === "directa"
      ? '<span class="badge-fase">Problema 1/2</span>'
      : '<span class="badge-fase-hecha">✓ Problema 1/2 resuelto</span> <span class="badge-fase">Problema 2/2</span>';
    return `
      <div class="ejercicio-card ${this.superado ? "superado" : ""}" data-indice="${indice}">
        <div class="ejercicio-header">
          <span class="ejercicio-num">4</span>
          <span class="ejercicio-titulo">Problema: identifica el tipo y resuelve</span>
          ${this.superado ? '<span class="badge-superado">✓ Superado</span>' : badgePaso}
        </div>
        <div class="enunciado enunciado-problema">🧩 ${escaparHTML(caso.texto)}</div>
        <div class="input-area">
          <div class="campo">
            <label for="ej${indice}-input">Resultado</label>
            <input id="ej${indice}-input" type="text" inputmode="decimal" class="number-input" placeholder="Resultado" data-accion="input" data-indice="${indice}" value="${escaparHTML(this.inputValue || "")}" ${disabled}>

          <button class="btn-secondary" data-accion="nuevo" data-indice="${indice}" ${disabled}>🔄 Nuevo</button>
        </div>
        ${renderFeedback(this)}
      </div>`;
  }
}

// Ejercicio 5: Porcentajes
// ---------------------------------------------------------------------------
class EjPorcentaje extends Ejercicio {
  generarNuevo() {
    const porcentajes = [5, 10, 15, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90];
    const totales = [80, 120, 200, 250, 300, 450, 500, 600, 750, 900, 1000];
    let intento = 0, porc, total;
    do {
      porc = porcentajes[Math.floor(Math.random() * porcentajes.length)];
      total = totales[Math.floor(Math.random() * totales.length)];
      intento++;
    } while (this.ultimaClave === `${porc}-${total}` && intento < 20);
    this.ultimaClave = `${porc}-${total}`;
    this.porc = porc;
    this.total = total;
    let valor = (porc / 100) * total;
    this.valorCalculado = Math.floor(valor) === valor ? Math.floor(valor) : +valor.toFixed(2);
    // Alterna en cada ejercicio nuevo entre los dos formatos:
    // "valor"      → calcular el X% de A (se da el porcentaje, se pide el resultado)
    // "porcentaje" → el X% de A es B, ¿cuánto vale X? (se da el resultado, se pide el porcentaje)
    this.tipo = this.tipo === "valor" ? "porcentaje" : "valor";
    this.solucion = this.tipo === "valor" ? this.valorCalculado : this.porc;
    this.inputValue = "";
    this.feedback = null;
  }
  verificar(valor) {
    if (this.superado) return { correcto: false, superado: true };
    const x = parseNumero(valor);
    if (!isNaN(x) && Math.abs(x - this.solucion) < 0.01) {
      this.racha++;
      if (this.racha >= 2) {
        this.superado = true;
        return { correcto: true, superado: true, msg: "🎉 ¡Superado! Sabes calcular porcentajes y también hallar qué porcentaje representa una cantidad." };
      }
      const rachaPrevia = this.racha;
      this.regenerarDistinto();
      this.racha = rachaPrevia;
      return { correcto: true, superado: false, msg: `✅ ¡Correcto! (${rachaPrevia}/2). Aquí tienes otro porcentaje.` };
    }
    this.racha = 0;
    if (this.tipo === "valor") {
      return {
        correcto: false,
        superado: false,
        msg: `❌ Incorrecto. Para calcular el ${this.porc}% de ${this.total}, divide el porcentaje entre 100 y multiplica por el total: (${this.porc} ÷ 100) × ${this.total} = ${this.valorCalculado}.`,
      };
    }
    return {
      correcto: false,
      superado: false,
      msg: `❌ Incorrecto. Para hallar qué porcentaje es ${this.valorCalculado} de ${this.total}, divide la cantidad entre el total y multiplica por 100: X = (${this.valorCalculado} ÷ ${this.total}) × 100 = ${this.porc}.`,
    };
  }
  render(indice) {
    const disabled = this.superado ? "disabled" : "";
    const enunciado = this.tipo === "valor"
      ? `🧮 Calcula: ${this.porc}% de ${this.total}`
      : `🧮 El X% de ${this.total} es ${this.valorCalculado}. ¿Cuánto vale X?`;
    const etiqueta = this.tipo === "valor" ? "Resultado" : "Valor de X (%)";
    return `
      <div class="ejercicio-card ${this.superado ? "superado" : ""}" data-indice="${indice}">
        <div class="ejercicio-header">
          <span class="ejercicio-num">5</span>
          <span class="ejercicio-titulo">Cálculo de porcentaje</span>
          ${this.superado ? '<span class="badge-superado">✓ Superado</span>' : ""}
        </div>
        <div class="enunciado">${enunciado}</div>
        <div class="input-area">
          <div class="campo">
            <label for="ej${indice}-input">${etiqueta}</label>
            <input id="ej${indice}-input" type="text" inputmode="decimal" class="number-input" placeholder="${etiqueta}" data-accion="input" data-indice="${indice}" value="${escaparHTML(this.inputValue || "")}" ${disabled}>
          </div>
          <button class="btn-primary" data-accion="comprobar" data-indice="${indice}" ${disabled}>Comprobar</button>
          <button class="btn-secondary" data-accion="nuevo" data-indice="${indice}" ${disabled}>🔄 Nuevo</button>
        </div>
        ${renderFeedback(this)}
      </div>`;
  }
}

    };
  }
  render(indice) {
    const disabled = this.superado ? "disabled" : "";
    return `
      <div class="ejercicio-card ${this.superado ? "superado" : ""}" data-indice="${indice}">
        <div class="ejercicio-header">
          <span class="ejercicio-num">7</span>
          <span class="ejercicio-titulo">Aumento porcentual</span>
          ${this.superado ? '<span class="badge-superado">✓ Superado</span>' : ""}
        </div>
        <div class="enunciado">📈 ${conArticulo(this.producto)} ${cuesta(this.producto)} ${this.precioInicial} €. Por ${this.motivo}, ${esPlural(this.producto) ? "sufren" : "sufre"} un incremento del ${this.incremento}%. ¿Cuál es su nuevo precio?</div>
        <div class="input-area">
          <div class="campo">
            <label for="ej${indice}-input">Precio final (€)</label>
            <input id="ej${indice}-input" type="text" inputmode="decimal" class="number-input" placeholder="Precio final (€)" data-accion="input" data-indice="${indice}" value="${escaparHTML(this.inputValue || "")}" ${disabled}>
          </div>
          <button class="btn-primary" data-accion="comprobar" data-indice="${indice}" ${disabled}>Comprobar</button>
          <button class="btn-secondary" data-accion="nuevo" data-indice="${indice}" ${disabled}>🔄 Nuevo</button>
        </div>
        ${renderFeedback(this)}
      </div>`;
  }
}

function renderFeedback(ej) {
  if (!ej.feedback) return "";
  let clase = "";
  if (ej.feedback.correcto) clase = "feedback-correcto";
  else clase = "feedback-error";
  return `<div class="${clase}" role="status" aria-live="polite">${ej.feedback.msg}</div>`;
}

// ---------------------------------------------------------------------------
// Estado global y render principal
// ---------------------------------------------------------------------------
const TOTAL_EJERCICIOS = 7;

const estado = {
  ejercicios: [
    new EjFraccionesEquivalentes(),
    new EjMagnitudesProporcionales(),
    new EjReglaDeTres(),
    new EjProblemaDirectaInversa(),
    new EjPorcentaje(),
    new EjDescuento(),
    new EjAumento(),
  ],
  fallos: 0,
  racha: 0,
  nombre: "",
  pidiendoNombre: false,
  modalAbierto: false,
  nombreTemporal: "",
  inicio: Date.now(),
};

function bandaNota(nota) {
  if (nota >= 10) return { bg: "#1a7a1a", texto: "#ffffff" };
  if (nota >= 9) return { bg: "#6dbf6d", texto: "#ffffff" };
  if (nota >= 8) return { bg: "#1a4f8a", texto: "#ffffff" };
  if (nota >= 7) return { bg: "#5b9bd5", texto: "#ffffff" };
  if (nota >= 6) return { bg: "#c05c00", texto: "#ffffff" };
  if (nota >= 5) return { bg: "#f5a623", texto: "#000000" };
  return { bg: "#c0392b", texto: "#ffffff" };
}

function formatearTiempo(inicio) {
  const segundos = Math.floor((Date.now() - inicio) / 1000);
  const minutosTotales = Math.ceil(segundos / 60);
  const horas = Math.floor(minutosTotales / 60);
  const minutos = minutosTotales % 60;
  return `${horas.toString().padStart(2, "0")}:${minutos.toString().padStart(2, "0")}`;
}

function superados() {
  return estado.ejercicios.filter((e) => e.superado).length;
}

function nota() {
  let valor = superados() - estado.fallos * 0.2;
  if (valor < 0) valor = 0;
  let escalado = (valor / TOTAL_EJERCICIOS) * 10;
  if (escalado > 10) escalado = 10;
  return escalado;
}

function render() {
  const notaActual = nota();
  document.body.classList.toggle("all-green", notaActual >= 10);

  const banda = bandaNota(notaActual);
  const totalSuperados = superados();

  const tarjetasHTML = estado.ejercicios
    .map((ej, i) => ej.render(i) + (i < estado.ejercicios.length - 1 ? "<hr>" : ""))
    .join("");

  document.getElementById("root").innerHTML = `
    <div class="autoria">Material elaborado por Marta López de Letona Sánchez</div>
    <div class="ficha-wrapper">
      <div class="header">
        <h1>📐 Proporcionalidad directa/inversa</h1>
        <p>Fracciones equivalentes, magnitudes directas e inversas, regla de tres, problemas, porcentajes, aumentos y descuentos · 2º ESO</p>
        <div class="header-badges">
          <span class="header-badge">🎯 2 aciertos consecutivos → superado</span>
          <span class="header-badge">💡 Cada fallo resta 0,29 puntos</span>
        </div>
      </div>

      <div class="info-bar">
        <div class="info-item"><span class="info-icon">📊</span><span>Progreso: <span class="info-value">${totalSuperados}</span>/7</span></div>
        <div class="info-item"><span class="info-icon">🔥</span><span>Racha: <span class="info-value">${estado.racha}</span></span></div>
        <div class="info-item"><span class="info-icon">❌</span><span>Fallos: <span class="info-value">${estado.fallos}</span></span></div>
        <div class="info-item"><span class="info-icon">⭐</span><span>Nota: <span class="info-value">${notaActual.toFixed(1)}</span>/10</span></div>
      </div>

      <div class="name-section">
        <label for="nombre-alumno" class="name-label">👤 Alumno/a</label>
        <input id="nombre-alumno" type="text" class="name-input" placeholder="Escribe tu nombre..." value="${escaparHTML(estado.nombre)}">
      </div>

      <div id="ejerciciosContainer">${tarjetasHTML}</div>

      <div class="action-buttons">
        <button class="btn-large" id="btn-finalizar">📋 Finalizar y calificar</button>
        <button class="btn-outline" id="btn-reiniciar">🔄 Nueva ficha</button>
      </div>
    </div>

    <div class="modal-overlay ${estado.pidiendoNombre ? "show" : ""}">
      <div class="modal-card-name">
        <h3 style="color:var(--color-incorrecto)">✏️ Falta tu nombre</h3>
        <p style="margin:10px 0">Para calificar necesitas identificarte.</p>
        <label for="nombre-temporal" class="visually-hidden">Nombre completo</label>
        <input id="nombre-temporal" type="text" placeholder="Nombre completo"
               style="width:100%;padding:8px;margin:10px 0;border:1px solid var(--color-borde);border-radius:6px"
               value="${escaparHTML(estado.nombreTemporal)}">
        <button id="btn-continuar-nombre"
                style="background:var(--color-acento);color:white;padding:8px;width:100%;border:none;border-radius:6px;cursor:pointer">
          Continuar
        </button>
      </div>
    </div>

    <div class="modal-overlay ${estado.modalAbierto ? "show" : ""}">
      <div class="modal-card" style="background-color:${banda.bg};color:${banda.texto}">
        <button class="modal-close" id="btn-cerrar-modal" style="color:${banda.texto}" aria-label="Cerrar">✕</button>
        <div style="font-weight:600">${escaparHTML(estado.nombre.toUpperCase())}</div>
        <div style="font-size:0.85rem">📐 Proporcionalidad directa/inversa · 2º ESO</div>
        <div class="modal-grade">${notaActual.toFixed(1)} / 10</div>
        <div class="modal-message">${notaActual >= 7 ? "👍 Muy bien" : notaActual >= 5 ? "📘 Aprobado" : "📚 Repasa"}</div>
        <div class="modal-stats" style="color:var(--color-texto)">
          <p>📅 ${new Date().toLocaleDateString("es-ES")}&nbsp;&nbsp;🕐 ${new Date().toLocaleTimeString("es-ES")}</p>
          <p>⏱️ Tiempo: ${formatearTiempo(estado.inicio)}</p>
          <p>✅ Ejercicios superados: ${totalSuperados}/7</p>
          <p>❌ Fallos: ${estado.fallos}</p>
          <p>⭐ Nota: ${notaActual.toFixed(1)}/10</p>
        </div>
        <div class="recordatorio" style="color:var(--color-texto)">📸 Haz una captura de pantalla y entrégala en Google Classroom.</div>
        <div class="modal-footer">Material elaborado por Marta López de Letona Sánchez</div>
      </div>
    </div>`;

  adjuntarEventos();
}

function adjuntarEventos() {
  const root = document.getElementById("root");

  const nombreInput = document.getElementById("nombre-alumno");
  if (nombreInput) {
    nombreInput.addEventListener("input", (e) => { estado.nombre = e.target.value; });
  }

  root.querySelectorAll('[data-accion="select"]').forEach((el) => {
    el.addEventListener("change", (e) => {
      const i = Number(e.target.dataset.indice);
      estado.ejercicios[i].selectedValue = e.target.value;
    });
  });

  root.querySelectorAll('[data-accion="select-opcion"]').forEach((el) => {
    el.addEventListener("change", (e) => {
      const i = Number(e.target.dataset.indice);
      const o = Number(e.target.dataset.opcion);
      estado.ejercicios[i].opciones[o].selected = e.target.value === "true";
    });
  });

  root.querySelectorAll('[data-accion="input"]').forEach((el) => {
    el.addEventListener("input", (e) => {
      const i = Number(e.target.dataset.indice);
      estado.ejercicios[i].inputValue = e.target.value;
    });
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); comprobar(Number(e.target.dataset.indice)); }
    });
  });

  root.querySelectorAll('[data-accion="comprobar"]').forEach((el) => {
    el.addEventListener("click", (e) => comprobar(Number(e.target.dataset.indice)));
  });

  root.querySelectorAll('[data-accion="nuevo"]').forEach((el) => {
    el.addEventListener("click", (e) => nuevoEjercicio(Number(e.target.dataset.indice)));
  });

  const btnFinalizar = document.getElementById("btn-finalizar");
  if (btnFinalizar) btnFinalizar.addEventListener("click", abrirModal);

  const btnReiniciar = document.getElementById("btn-reiniciar");
  if (btnReiniciar) btnReiniciar.addEventListener("click", reiniciarFicha);

  const nombreTempInput = document.getElementById("nombre-temporal");
  if (nombreTempInput) {
    nombreTempInput.addEventListener("input", (e) => { estado.nombreTemporal = e.target.value; });
    nombreTempInput.addEventListener("keydown", (e) => { if (e.key === "Enter") confirmarNombre(); });
  }

  const btnContinuarNombre = document.getElementById("btn-continuar-nombre");
  if (btnContinuarNombre) btnContinuarNombre.addEventListener("click", confirmarNombre);

  const btnCerrarModal = document.getElementById("btn-cerrar-modal");
  if (btnCerrarModal) btnCerrarModal.addEventListener("click", () => { estado.modalAbierto = false; render(); });
}

function comprobar(indice) {
  const ej = estado.ejercicios[indice];
  if (ej.superado) return;
  let resultado;
  const aviso = (msg) => {
    // aviso sin contar como fallo ni cambiar de ejercicio
    ej.feedback = { correcto: false, aviso: true, msg: "⚠️ " + msg + AVISO };
    render();
  };

  if (indice === 0) {
    if (!ej.selectedValue) return aviso("Selecciona una opción.");
    resultado = ej.verificar(ej.selectedValue === "true");
  } else if (indice === 1) {
    if (!ej.opciones.every((o) => o.selected !== null)) return aviso("Completa todas las opciones.");
    resultado = ej.verificar(ej.opciones.map((o) => o.selected));
  } else {
    const valor = String(ej.inputValue ?? "").trim();
    if (valor === "") return aviso("Introduce un valor.");
    if (isNaN(parseNumero(valor))) return aviso("Escribe un número (con coma o punto para los decimales).");
    resultado = ej.verificar(valor);
  }

  if (!resultado.correcto && !resultado.superado) {
    estado.fallos++;
    // Tras un fallo que enseña la solución: «Solución del ejercicio anterior» y otro enunciado
    let msg = resultado.msg;
    if (indice === 1) {
      msg = msg.replace("❌ Tienes ", "❌ En el ejercicio anterior tenías ") + " 👉 Ahora inténtalo con estas magnitudes nuevas.";
    } else {
      let resto = msg.replace(/^❌ Incorrecto[.:] /, "");
      if (/^[A-ZÁÉÍÓÚ][a-záéíóúñ]/.test(resto)) resto = resto.charAt(0).toLowerCase() + resto.slice(1);
      msg = "❌ Incorrecto. Solución del ejercicio anterior: " + resto + " 👉 Ahora inténtalo con este nuevo.";
    }
    resultado = { ...resultado, msg };
    ej.regenerarDistinto();
  }
  if (indice !== 1) estado.racha = resultado.correcto ? ej.racha : 0;
  ej.feedback = resultado;
  render();
}

function nuevoEjercicio(indice) {
  const ej = estado.ejercicios[indice];
  if (ej && !ej.superado) {
    ej.nuevoEjercicio();
    estado.racha = 0;
    render();
  }
}

function abrirModal() {
  if (!estado.nombre.trim()) {
    estado.pidiendoNombre = true;
    render();
    return;
  }
  estado.modalAbierto = true;
  render();
}

function confirmarNombre() {
  if (estado.nombreTemporal.trim()) {
    estado.nombre = estado.nombreTemporal.trim();
    estado.pidiendoNombre = false;
    estado.modalAbierto = true;
    render();
  }
}

function reiniciarFicha() {
  confirmar("¿Reiniciar toda la ficha? Se perderá todo el progreso.").then((ok) => { if (ok) window.location.reload(); });
}

render();
</script>
